###########################
#      Wav2Lip
###########################
rescale: True    # Whether to rescale audio prior to preprocessing
rescaling_max: 0.9    # Rescaling value

# Use LWS (https://github.com/Jonathan-LeRoux/lws) for STFT and phase reconstruction
# It"s preferred to set True to use with https://github.com/r9y9/wavenet_vocoder
# Does not work if n_ffit is not multiple of hop_size!!
use_lws: False  

# n_fft: 1060    # Extra window size is filled with 0 paddings to match this parameter
# hop_size: 265    # For 16000Hz   200 :  12.5 ms (0.0125 * sample_rate)
# win_size: 1060    # For 16000Hz   800 :  50 ms (If None   win_size :  n_fft) (0.05 * sample_rate)
# sample_rate: 16000    # 16000Hz (corresponding to librispeech) (sox --i <filename>)

frame_shift_ms: None    # Can replace hop_size parameter. (Recommended: 12.5)

# Mel and Linear spectrograms normalization/scaling and clipping
signal_normalization: False  
# Whether to normalize mel spectrograms to some predefined range (following below parameters)
allow_clipping_in_normalization: True    # Only relevant if mel_normalization :  True
symmetric_mels: True  
# Whether to scale the data to be symmetric around 0. (Also multiplies the output range by 2   
# faster and cleaner convergence)
max_abs_value: 4.  
# max absolute value of data. If symmetric   data will be [-max   max] else [0   max] (Must not 
# be too big to avoid gradient explosion   
# not too small for fast convergence)
# Contribution by @begeekmyfriend
# Spectrogram Pre-Emphasis (Lfilter: Reduce spectrogram noise and helps model certitude 
# levels. Also allows for better G&L phase reconstruction)
preemphasize: True    # whether to apply filter
preemphasis: 0.97    # filter coefficient.

# Limits
min_level_db: -100  
ref_level_db: 20  
fmin: 55  
# Set this to 55 if your speaker is male! if female   95 should help taking off noise. (To 
# test depending on dataset. Pitch info: male~[65   260]   female~[100   525])
fmax: 7600   

